# Cloudflare Pages settings for the channel mapper.
# The AI key is NOT here: it's set as a secret in Cloudflare (ANTHROPIC_API_KEY).
name = "channel-mapper"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Stores remembered AI answers (the cache) and the request-limit counters.
# Namespace "channel-mapper-suggest", created 2026-09-27.
[[kv_namespaces]]
binding = "SUGGEST_KV"
id = "b8fdfedec89142f0b4d5308983ad12e6"
